openapi: 3.0.3
info:
  title: Book Worm API
  description: REST API for the Book Worm online e-bookstore.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Registration and authentication
  - name: Account
    description: User profile, addresses, and personalized recommendations
  - name: Catalogue
    description: Categories, books, authors, and publishers browsing
  - name: Cart
    description: Shopping basket management
  - name: Orders
    description: Order placement, history, cancellation, and Buy It Again
  - name: Payments
    description: Simulated payment processing

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new customer account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      tags:
        - Account
      summary: Get the current user profile and gift points balance
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/addresses:
    get:
      tags:
        - Account
      summary: List saved delivery addresses
      operationId: getAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved delivery addresses, default address first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Account
      summary: Save a new delivery address
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/recommendations:
    get:
      tags:
        - Account
      summary: Get personalized book recommendations based on order history
      operationId: getRecommendations
      security:
        - bearerAuth: []
      parameters:
        - name: size
          in: query
          description: Maximum number of recommendations to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/categories:
    get:
      tags:
        - Catalogue
      summary: List all catalogue categories
      operationId: getCategories
      security: []
      responses:
        '200':
          description: All catalogue categories in sidebar order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/books:
    get:
      tags:
        - Catalogue
      summary: Search and filter books with pagination
      operationId: getBooks
      security: []
      parameters:
        - name: q
          in: query
          description: Search term across title, author name, and publisher name
          required: false
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          description: Category slug
          required: false
          schema:
            type: string
        - name: authorId
          in: query
          description: Author ID filter
          required: false
          schema:
            type: integer
            format: int64
        - name: publisherId
          in: query
          description: Publisher ID filter
          required: false
          schema:
            type: integer
            format: int64
        - name: language
          in: query
          description: Language filter
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Book format filter
          required: false
          schema:
            type: string
            enum: [PAPERBACK, HARDCOVER, EBOOK]
        - name: minPrice
          in: query
          description: Minimum price filter (inclusive, 2 decimal places)
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum price filter (inclusive, 2 decimal places)
          required: false
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          description: Sorting criteria
          required: false
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest, bestselling]
            default: relevance
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paged list of book summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/books/{bookId}:
    get:
      tags:
        - Catalogue
      summary: Get detailed book information by ID
      operationId: getBookById
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '200':
          description: Detailed book information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/books/{bookId}/related:
    get:
      tags:
        - Catalogue
      summary: Get related books for a given book
      operationId: getRelatedBooks
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
        - name: size
          in: query
          description: Maximum number of related books to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: List of related book summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/authors:
    get:
      tags:
        - Catalogue
      summary: List authors with pagination
      operationId: getAuthors
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paged list of authors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/authors/{authorId}:
    get:
      tags:
        - Catalogue
      summary: Get author details by ID
      operationId: getAuthorById
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorIdPath'
      responses:
        '200':
          description: Author details with biography
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/publishers:
    get:
      tags:
        - Catalogue
      summary: List publishers with pagination
      operationId: getPublishers
      security: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paged list of publishers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/publishers/{publisherId}:
    get:
      tags:
        - Catalogue
      summary: Get publisher details by ID
      operationId: getPublisherById
      security: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Publisher details with description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Get the current user shopping basket with totals
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shopping basket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Cart
      summary: Empty the shopping basket
      operationId: clearCart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add a book to the shopping basket
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Updated shopping basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/items/{bookId}:
    put:
      tags:
        - Cart
      summary: Update the quantity of a book in the shopping basket
      operationId: updateCartItemQuantity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Updated shopping basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Cart
      summary: Remove a book from the shopping basket
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '200':
          description: Updated shopping basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders:
    post:
      tags:
        - Orders
      summary: Place an order from the shopping basket
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          headers:
            Location:
              description: URI of the newly created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Orders
      summary: List user order history with pagination
      operationId: getOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Optional filter by order status
          required: false
          schema:
            type: string
            enum: [PENDING_PAYMENT, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paged list of orders, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order details by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Detailed order information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/payments:
    post:
      tags:
        - Payments
      summary: Process simulated payment for an order
      operationId: processPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment processed and purchase confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Payment declined by simulated gateway
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel an order within the allowed cancellation window
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order cancelled and refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}/buy-again:
    post:
      tags:
        - Orders
      summary: Copy items from a past order into the shopping basket
      operationId: buyAgain
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Items added to cart with summary of added and skipped items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyAgainResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication with JWT

  parameters:
    PageQuery:
      name: page
      in: query
      description: Zero-based page index
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    BookIdPath:
      name: bookId
      in: path
      description: Book ID
      required: true
      schema:
        type: integer
        format: int64
    AuthorIdPath:
      name: authorId
      in: path
      description: Author ID
      required: true
      schema:
        type: integer
        format: int64
    PublisherIdPath:
      name: publisherId
      in: path
      description: Publisher ID
      required: true
      schema:
        type: integer
        format: int64
    OrderIdPath:
      name: orderId
      in: path
      description: Order ID
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Bad request or validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, or expired authentication token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not owned by user
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict, empty cart, or insufficient stock
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User email address, normalized to lower case
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Plain text password (at least 8 chars, max 72 bytes)
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^\+639\d{9}$'
          description: Philippine mobile number (+639XXXXXXXXX)

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          writeOnly: true
          description: Plain text password

    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token expiration duration in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - giftPointsBalance
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        giftPointsBalance:
          type: integer
          description: Available gift points balance

    AddressRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - streetAddress
        - city
        - province
        - zipCode
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          pattern: '^\+639\d{9}$'
        streetAddress:
          type: string
          minLength: 1
          maxLength: 255
        barangay:
          type: string
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
        zipCode:
          type: string
          pattern: '^\d{4}$'
          description: 4-digit Philippine postal code
        country:
          type: string
          maxLength: 60
          default: Philippines
        isDefault:
          type: boolean
          default: false

    AddressResponse:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - streetAddress
        - city
        - province
        - zipCode
        - country
        - isDefault
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        streetAddress:
          type: string
        barangay:
          type: string
          nullable: true
        city:
          type: string
        province:
          type: string
        zipCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ShippingAddress:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - streetAddress
        - city
        - province
        - zipCode
        - country
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        streetAddress:
          type: string
        barangay:
          type: string
          nullable: true
        city:
          type: string
        province:
          type: string
        zipCode:
          type: string
        country:
          type: string

    CategoryResponse:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string

    AuthorSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    AuthorResponse:
      type: object
      required:
        - id
        - name
      properties:
