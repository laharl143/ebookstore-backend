    PaymentRequest:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, E_WALLET]
        cardNumber:
          type: string
          writeOnly: true
          description: 13-19 digit card number (Luhn valid) for card methods
        cardHolderName:
          type: string
          minLength: 1
          maxLength: 100
          description: Cardholder full name for card methods
        cvv:
          type: string
          pattern: '^\d{3,4}$'
          writeOnly: true
          description: 3 or 4 digit security code for card methods
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/\d{4}$'
          writeOnly: true
          description: Expiration date in MM/YYYY format for card methods
        walletMobileNumber:
          type: string
          pattern: '^\+639\d{9}$'
          writeOnly: true
          description: Philippine mobile number for E_WALLET method

