spring.application.name=ebookstore-backend

# Optional, gitignored overrides for local runs (see application-local.properties.example).
# Resolved from the working directory, so run the app from the project root.
spring.config.import=optional:file:./application-local.properties

# Database: credentials come only from environment variables (never commit them).
# DB_URL is optional; DB_USERNAME and DB_PASSWORD have no default, so startup fails fast if they are missing.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Store rules (spec 0002). Not secrets; override per environment if needed.
app.currency=PHP
app.zone=Asia/Manila
app.vat-rate=0.12
app.delivery-charge=0.00
app.delivery-days=5
app.points.pesos-per-point=100
app.points.peso-value=1
app.cancel-window-hours=48

# Swagger UI configuration (spec 0003)
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html
