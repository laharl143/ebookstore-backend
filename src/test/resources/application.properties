spring.application.name=ebookstore-backend

# Tests run on in-memory H2 in PostgreSQL mode, so `mvn clean install` needs no PostgreSQL and no DB_* env vars.
spring.datasource.url=jdbc:h2:mem:bookworm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same migrations as the real app.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Same store rules as the real app.
app.currency=PHP
app.zone=Asia/Manila
app.vat-rate=0.12
app.delivery-charge=0.00
app.delivery-days=5
app.points.pesos-per-point=100
app.points.peso-value=1
app.cancel-window-hours=48
